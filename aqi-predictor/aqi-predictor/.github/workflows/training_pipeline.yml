name: Daily Training Pipeline

on:
  schedule:
    - cron: "0 3 * * *"   # once daily at 03:00 UTC -- after several hourly feature runs have landed
  workflow_dispatch: {}

permissions:
  contents: read

# Unlike the feature pipeline, overlapping training runs aren't a
# correctness risk (each run trains and registers independent model
# versions) -- but there's no reason to ever run two at once, so the same
# guard is applied for tidiness and to avoid wasting Actions minutes.
concurrency:
  group: training-pipeline
  cancel-in-progress: false

jobs:
  run-training-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # model training legitimately takes longer than a feature fetch

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install training dependencies
        run: pip install -r requirements-training.txt

      - name: Run training pipeline
        env:
          AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m training_pipeline.train